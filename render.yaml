# Render Blueprint: Python API musí bežať z priečinka `backend`, kde je balík `app`.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: smarthub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
